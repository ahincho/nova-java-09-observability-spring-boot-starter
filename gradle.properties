# NOVA-SEMVER-23: Habilitar Gradle Local Build Cache
org.gradle.caching=true

# NOVA-SEMVER-24: Habilitar Configuration Cache (Gradle 8.6+).
# Override local de este repo: se apagó porque los strictly() sobre tomcat-embed-* disparaban
# un bug de serialización de compileJava.classpath en la caché de configuración de Gradle 9;
# sin ella el gate de OWASP quedó en verde (14 CVE -> 0). Con Spring Boot 4.0.8 y
# strictly(11.0.26) ya no se reproduce (comprobado el 2026-09-30 con Gradle 9.2.0), pero se
# deja apagada: reactivarla es un cambio aparte.
org.gradle.configuration-cache=false